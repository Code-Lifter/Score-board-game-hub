<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decrypto — Digital Score Sheet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #d9dbde;
    --bg-panel: #ffffff;
    --bg-alt: #cfd1d5;
    --line: #4f5359;
    --line-width: 2px;
    --text-main: #111111;
    --text-muted: #4b5563;
  }

  body {
    background: var(--bg-page);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    transition: background 0.35s ease;
  }

  /* BLACK SIDE THEME */
  body.side-black {
    --bg-page: #16171a;
    --bg-panel: #0e0f11;
    --bg-alt: #232529;
    --line: #cfd1d5;
    --text-main: #f2f2f2;
    --text-muted: #b8bcc2;
  }

  .font-orbitron { font-family: 'Orbitron', sans-serif; }

  /* Authentic Borders */
  .border-game { border: var(--line-width) solid var(--line); }
  .border-b-game { border-bottom: var(--line-width) solid var(--line); }
  .border-r-game { border-right: var(--line-width) solid var(--line); }

  /* Backgrounds */
  .bg-alt { background-color: var(--bg-alt); }
  .bg-panel { background-color: var(--bg-panel); }

  .text-main { color: var(--text-main); }
  .text-muted { color: var(--text-muted); }

  /* Inputs */
  .line-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid transparent;
    outline: none;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    transition: border-color 0.2s;
    color: var(--text-main);
  }
  .line-input:focus { border-bottom-color: rgba(128,128,128,0.5); }

  .sq-input {
    width: 28px;
    height: 28px;
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px solid var(--line);
    box-shadow: inset 1.5px 1.5px 4px rgba(0,0,0,0.15);
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    border-radius: 2px;
  }
  .sq-input:focus {
    outline: none;
    border-width: 2px;
  }

  /* Slanted Tabs */
  .slant-right {
    transform: skewX(-25deg);
    transform-origin: bottom left;
  }

  /* Custom Scrollbar for Textareas */
  textarea::-webkit-scrollbar { width: 6px; }
  textarea::-webkit-scrollbar-track { background: transparent; }
  textarea::-webkit-scrollbar-thumb { background: #a0a0a0; border-radius: 3px; }

  .toolbar-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .toolbar-btn-outline {
    border: 1px solid var(--line);
    color: var(--text-main);
  }
  .toolbar-btn-outline:hover:not(:disabled) { background: var(--bg-alt); }

  /* Flip control */
  #flipBtn {
    background: var(--text-main);
    color: var(--bg-page);
  }
  #flipBtn:hover { opacity: 0.85; }

  .side-badge {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.12em;
  }

  /* Flip animation */
  #sheetContent { transition: opacity 0.18s ease; }
  #sheetContent.flipping { opacity: 0; }
</style>
</head>
<body class="min-h-screen">

  <!-- Top bar -->
  <div class="w-full border-b border-gray-400 sticky top-0 z-50 shadow-sm" style="background: var(--bg-page); backdrop-filter: blur(4px);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="text-xs sm:text-sm text-muted hover:opacity-70 font-semibold flex items-center gap-1 transition-colors">
        <span aria-hidden="true">←</span> Home
      </a>
      <div class="flex items-center gap-2">
        <button id="flipBtn" class="text-xs sm:text-sm px-3 py-1.5 rounded font-bold flex items-center gap-1.5 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L20 4M8 21H3v-5M20 4L4 20"/></svg>
          Flip Sheet
        </button>
        <button id="undoBtn" class="toolbar-btn toolbar-btn-outline text-xs sm:text-sm px-3 py-1.5 rounded transition-colors font-medium">Undo</button>
        <button id="redoBtn" class="toolbar-btn toolbar-btn-outline text-xs sm:text-sm px-3 py-1.5 rounded transition-colors font-medium">Redo</button>
        <button id="resetBtn" class="text-xs sm:text-sm px-3 py-1.5 rounded border border-red-700 text-red-600 hover:bg-red-600 hover:text-white transition-colors font-medium ml-2">Reset</button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-6 sm:py-8">

    <!-- Title and Team -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-6 gap-5">
      <div class="flex items-center gap-3">
        <h1 class="font-orbitron text-4xl sm:text-[2.75rem] font-black tracking-[0.08em] pl-2 drop-shadow-sm">DECRYPTO</h1>
        <span id="sideBadge" class="side-badge text-[11px] font-bold px-2.5 py-1 rounded border-game mb-1"></span>
      </div>

      <div class="border-game rounded-lg bg-panel flex flex-col w-full sm:w-[380px] overflow-hidden shadow-sm">
        <div class="flex h-7 border-b-game bg-panel">
          <div class="bg-alt pl-3 pr-2 flex items-center font-orbitron text-[11px] font-bold text-muted uppercase tracking-widest">TEAM</div>
          <div class="w-4 bg-alt slant-right border-r-game -ml-[1px]"></div>
        </div>
        <div class="px-3 py-2">
          <input id="teamName" type="text" autocomplete="off" spellcheck="false" class="line-input text-xl sm:text-2xl font-semibold uppercase">
        </div>
      </div>
    </div>

    <div id="sheetContent">
      <!-- Rounds grid -->
      <div id="roundsWrap" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"></div>

      <!-- Bottom Section: Keywords -->
      <div class="overflow-x-auto w-full border-game rounded-lg shadow-sm bg-panel">
        <div class="min-w-[600px] flex overflow-hidden">
          <div id="wordCols" class="flex-1 grid grid-cols-4"></div>
        </div>
      </div>
    </div>

  </main>

  <footer class="text-center pb-8 pt-4">
    <p class="text-xs font-semibold text-muted tracking-wide">Autosaved to this device</p>
  </footer>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "decrypto-sheet-state-v5"; // bumped for two-sided sheet
  const LEGACY_KEY = "decrypto-sheet-state-v4";
  const ROUNDS = 8;
  const MAX_HISTORY = 60;
  const SIDES = ["white", "black"];

  function freshSideData(){
    return {
      rounds: Array.from({length: ROUNDS}, () => ({
        lines: [
          {text: "", a: "", b: ""},
          {text: "", a: "", b: ""},
          {text: "", a: "", b: ""}
        ]
      })),
      words: ["", "", "", ""]
    };
  }

  function freshState(){
    return {
      teamName: "",
      activeSide: "white",
      sides: {
        white: freshSideData(),
        black: freshSideData()
      }
    };
  }

  function isValidState(parsed){
    return parsed && parsed.sides && parsed.sides.white && parsed.sides.black &&
           Array.isArray(parsed.sides.white.rounds) && Array.isArray(parsed.sides.black.rounds);
  }

  function loadInitial(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(isValidState(parsed)) return parsed;
      }
    }catch(e){ /* ignore corrupt storage */ }

    // Attempt migration from legacy single-sided sheet
    try{
      const legacyRaw = localStorage.getItem(LEGACY_KEY);
      if(legacyRaw){
        const legacy = JSON.parse(legacyRaw);
        if(legacy && legacy.rounds && legacy.words){
          const migrated = freshState();
          migrated.teamName = legacy.teamName || "";
          migrated.sides.white = { rounds: legacy.rounds, words: legacy.words };
          return migrated;
        }
      }
    }catch(e){ /* ignore corrupt legacy storage */ }

    return freshState();
  }

  let state = loadInitial();
  let history = [JSON.parse(JSON.stringify(state))];
  let histIdx = 0;

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ }
  }

  function commit(){
    history = history.slice(0, histIdx + 1);
    history.push(JSON.parse(JSON.stringify(state)));
    if(history.length > MAX_HISTORY){ history.shift(); }
    histIdx = history.length - 1;
    persist();
    updateToolbar();
  }

  function undo(){
    if(histIdx <= 0) return;
    histIdx -= 1;
    state = JSON.parse(JSON.stringify(history[histIdx]));
    persist();
    render();
    updateToolbar();
  }

  function redo(){
    if(histIdx >= history.length - 1) return;
    histIdx += 1;
    state = JSON.parse(JSON.stringify(history[histIdx]));
    persist();
    render();
    updateToolbar();
  }

  function resetAll(){
    state = freshState();
    history = [JSON.parse(JSON.stringify(state))];
    histIdx = 0;
    persist();
    render();
    updateToolbar();
  }

  function updateToolbar(){
    document.getElementById("undoBtn").disabled = histIdx <= 0;
    document.getElementById("redoBtn").disabled = histIdx >= history.length - 1;
  }

  function escapeAttr(str){
    return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function currentSideData(){
    return state.sides[state.activeSide];
  }

  /* CORE LOGIC: Auto-populate the bottom columns based on clues & correct answers */
  function updateDerivedWords() {
    const sideData = currentSideData();
    let newWords = ["", "", "", ""];
    for(let r = 0; r < ROUNDS; r++){
      for(let l = 0; l < 3; l++){
        const clue = sideData.rounds[r].lines[l].text.trim();
        const correctNum = sideData.rounds[r].lines[l].b.trim();

        if(clue && ["1", "2", "3", "4"].includes(correctNum)){
          const colIdx = parseInt(correctNum, 10) - 1;
          if(newWords[colIdx].length > 0){
            newWords[colIdx] += "\n" + clue;
          } else {
            newWords[colIdx] = clue;
          }
        }
      }
    }
    sideData.words = newWords;
  }

  /* RENDER ROUNDS */
  function roundPanel(rIdx){
    const label = "ROUND " + String(rIdx + 1).padStart(2, "0");
    const r = currentSideData().rounds[rIdx];

    const lines = r.lines.map((ln, li) => {
      const bgClass = li === 1 ? 'bg-alt' : 'bg-panel';
      return `
        <div class="flex items-center px-2 py-2 ${bgClass}">
          <input type="text" maxlength="30" data-round="${rIdx}" data-line="${li}" data-field="text" autocomplete="off" spellcheck="false"
            class="line-input" value="${escapeAttr(ln.text)}">
          <div class="flex gap-1.5 sm:gap-2 ml-3 flex-shrink-0">
            <input type="text" maxlength="3" data-round="${rIdx}" data-line="${li}" data-field="a" autocomplete="off"
              class="sq-input" value="${escapeAttr(ln.a)}">
            <input type="text" maxlength="3" data-round="${rIdx}" data-line="${li}" data-field="b" autocomplete="off"
              class="sq-input" value="${escapeAttr(ln.b)}">
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="border-game rounded-lg overflow-hidden bg-panel flex flex-col shadow-sm relative">
        <div class="flex justify-between items-end border-b-game bg-panel">
           <div class="flex h-7 relative z-10">
              <div class="bg-alt pl-3 pr-2 flex items-center font-orbitron text-[11.5px] font-bold tracking-widest text-muted uppercase">
                 ${label}
              </div>
              <div class="w-4 bg-alt slant-right border-r-game -ml-[1px]"></div>
           </div>
           <div class="flex gap-1.5 sm:gap-2 pr-2 pb-1 text-muted">
              <span class="w-[28px] text-center text-[13px] font-bold font-orbitron">?</span>
              <span class="w-[28px] text-center flex justify-center">
                 <svg class="w-[18px] h-[18px] mt-[2px]" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5.41c0-.53-.21-1.04-.59-1.41l-2-2A1.99 1.99 0 0 0 17.59 3zM12 19c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm1-10H7V5h6v4z"/></svg>
              </span>
           </div>
        </div>
        <div class="flex flex-col">
           ${lines}
        </div>
      </div>
    `;
  }

  function renderRounds(){
    document.getElementById("roundsWrap").innerHTML = Array.from({length: ROUNDS}, (_, i) => roundPanel(i)).join("");
  }

  /* RENDER BOTTOM SECTION */
  function renderCodesSection(){
    const sideData = currentSideData();
    document.getElementById("wordCols").innerHTML = [0, 1, 2, 3].map(i => {
      const isGrey = i % 2 === 1;
      const bgClass = isGrey ? 'bg-alt' : 'bg-panel';
      const borderRight = i < 3 ? 'border-r-game' : '';

      return `
        <div class="flex flex-col ${bgClass} ${borderRight}">
           <div class="flex h-7 border-b-game bg-panel">
              <div class="${bgClass} pl-3 pr-2 flex items-center font-orbitron text-[11px] font-bold text-muted tracking-widest uppercase">
                 <svg class="w-3.5 h-3.5 inline-block mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4h2.35v3h4v-3h2v-4h-8.35zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                 ${i + 1}
              </div>
              <div class="w-4 ${bgClass} slant-right border-r-game -ml-[1px]"></div>
              <div class="flex-1 bg-panel"></div>
           </div>
           <div class="flex-1 p-2.5">
              <textarea readonly data-wordcol="${i}" spellcheck="false" class="w-full h-full bg-transparent resize-none outline-none text-sm font-semibold uppercase leading-8 cursor-default" rows="8">${escapeAttr(sideData.words[i])}</textarea>
           </div>
        </div>
      `;
    }).join("");
  }

  function renderSideChrome(){
    const isBlack = state.activeSide === "black";
    document.body.classList.toggle("side-black", isBlack);
    const badge = document.getElementById("sideBadge");
    badge.textContent = isBlack ? "SIDE B · BLACK · DECRYPTING" : "SIDE A · WHITE · OUR CODE";
  }

  function render(){
    document.getElementById("teamName").value = state.teamName;
    updateDerivedWords();
    renderRounds();
    renderCodesSection();
    renderSideChrome();
  }

  function flipSide(){
    const content = document.getElementById("sheetContent");
    content.classList.add("flipping");
    setTimeout(() => {
      state.activeSide = state.activeSide === "white" ? "black" : "white";
      persist();
      render();
      content.classList.remove("flipping");
    }, 160);
  }

  /* EVENT LISTENERS */

  document.getElementById("roundsWrap").addEventListener("change", function(e){
    const el = e.target;
    if(el.dataset.round === undefined) return;
    const rIdx = parseInt(el.dataset.round, 10);
    const sideData = currentSideData();

    if(el.dataset.line !== undefined && el.dataset.field !== undefined){
      sideData.rounds[rIdx].lines[parseInt(el.dataset.line, 10)][el.dataset.field] = el.value;

      if (el.dataset.field === 'text' || el.dataset.field === 'b') {
          updateDerivedWords();
          renderCodesSection();
      }

      commit();
      return;
    }
  });

  document.getElementById("teamName").addEventListener("change", function(e){
    state.teamName = e.target.value;
    commit();
  });

  document.getElementById("flipBtn").addEventListener("click", flipSide);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  document.getElementById("resetBtn").addEventListener("click", function(){
    if(confirm("Reset both sides of the sheet? This clears everything.")){
      resetAll();
    }
  });

  window.addEventListener("keydown", function(e){
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    if(e.key.toLowerCase() === "z" && !e.shiftKey){ e.preventDefault(); undo(); }
    else if((e.key.toLowerCase() === "z" && e.shiftKey) || e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); }
    else if(e.key.toLowerCase() === "f"){ e.preventDefault(); flipSide(); }
  });

  render();
  updateToolbar();
})();
</script>
</body>
</html>
