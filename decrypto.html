<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decrypto — Digital Score Sheet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #d9dbde;
    --bg-panel: #ffffff;
    --bg-alt: #cfd1d5;
    --line: #4f5359;
    --line-width: 2px;
    --text-main: #111111;
    --text-muted: #4b5563;
  }

  body {
    background: var(--bg-page);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    transition: background 0.35s ease;
  }

  body.side-black {
    --bg-page: #16171a;
    --bg-panel: #0e0f11;
    --bg-alt: #232529;
    --line: #cfd1d5;
    --text-main: #f2f2f2;
    --text-muted: #b8bcc2;
  }

  .font-orbitron { font-family: 'Orbitron', sans-serif; }

  .border-game { border: var(--line-width) solid var(--line); }
  .border-b-game { border-bottom: var(--line-width) solid var(--line); }
  .border-r-game { border-right: var(--line-width) solid var(--line); }
  .border-t-game { border-top: var(--line-width) solid var(--line); }

  .bg-alt { background-color: var(--bg-alt); }
  .bg-panel { background-color: var(--bg-panel); }

  .text-main { color: var(--text-main); }
  .text-muted { color: var(--text-muted); }

  .line-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid transparent;
    outline: none;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    transition: border-color 0.2s;
    color: var(--text-main);
    min-width: 0;
  }
  .line-input:focus { border-bottom-color: rgba(128,128,128,0.5); }

  .sq-input {
    width: 28px;
    height: 28px;
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px solid var(--line);
    box-shadow: inset 1.5px 1.5px 4px rgba(0,0,0,0.15);
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .sq-input:focus { outline: none; border-width: 2px; }

  .slant-right { transform: skewX(-25deg); transform-origin: bottom left; }

  textarea::-webkit-scrollbar { width: 6px; }
  textarea::-webkit-scrollbar-track { background: transparent; }
  textarea::-webkit-scrollbar-thumb { background: #a0a0a0; border-radius: 3px; }

  .toolbar-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .toolbar-btn-outline { border: 1px solid var(--line); color: var(--text-main); }
  .toolbar-btn-outline:hover:not(:disabled) { background: var(--bg-alt); }

  #flipBtn { background: var(--text-main); color: var(--bg-page); }
  #flipBtn:hover { opacity: 0.85; }

  .side-badge { font-family: 'Orbitron', sans-serif; letter-spacing: 0.12em; }

  #sheetContent { transition: opacity 0.18s ease; }
  #sheetContent.flipping { opacity: 0; }

  .round-result-badge {
    font-size: 10.5px; font-weight: 700;
    padding: 2px 7px 2px 4px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 4px;
  }

  #teamContextBanner { font-size: 11.5px; line-height: 1.4; }

  /* Team switch (single either/or slider) */
  .team-switch {
    position: relative;
    display: inline-flex;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--bg-panel);
  }
  .team-switch-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: calc(50% - 3px);
    height: calc(100% - 6px);
    border-radius: 999px;
    background: var(--text-main);
    transition: transform 0.25s ease, opacity 0.2s ease;
    z-index: 0;
    opacity: 0;
  }
  .team-switch.chosen .team-switch-thumb { opacity: 1; }
  .team-switch.pos-black .team-switch-thumb { transform: translateX(100%); }
  .team-switch-option {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    background: transparent; border: none; cursor: pointer;
    color: var(--text-main);
    transition: color 0.2s ease;
  }
  .team-switch-option.selected { color: var(--bg-panel); }
  .team-swatch {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid var(--line); flex-shrink: 0;
  }
  .team-swatch.white-swatch { background: #ffffff; }
  .team-swatch.black-swatch { background: #111214; }

  .token-icon-img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
  .token-slot-empty {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px dashed var(--line); opacity: 0.5;
  }

  /* ---------- MOBILE LAYOUT ---------- */
  @media (max-width: 767px) {
    #roundsWrap {
      display: flex !important;
      flex-wrap: nowrap !important;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-left: 12px;
      -webkit-overflow-scrolling: touch;
      gap: 12px !important;
      padding-bottom: 6px;
    }
    #roundsWrap > div {
      flex: 0 0 87%;
      scroll-snap-align: center;
    }
    #wordColsOuter { min-width: 0 !important; }
    #wordCols { grid-template-columns: 1fr !important; }
    #wordCols > div {
      border-right: none !important;
      border-bottom: var(--line-width) solid var(--line);
    }
    #wordCols > div:last-child { border-bottom: none; }
  }
</style>
</head>
<body class="min-h-screen">

  <div class="w-full border-b border-gray-400 sticky top-0 z-50 shadow-sm" style="background: var(--bg-page); backdrop-filter: blur(4px);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="text-xs sm:text-sm text-muted hover:opacity-70 font-semibold flex items-center gap-1 transition-colors">
        <span aria-hidden="true">←</span> Home
      </a>
      <div class="flex items-center gap-2 flex-wrap">
        <button id="flipBtn" class="text-xs sm:text-sm px-3 py-1.5 rounded font-bold flex items-center gap-1.5 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L20 4M8 21H3v-5M20 4L4 20"/></svg>
          Flip Sheet
        </button>
        <button id="undoBtn" class="toolbar-btn toolbar-btn-outline text-xs sm:text-sm px-3 py-1.5 rounded transition-colors font-medium">Undo</button>
        <button id="redoBtn" class="toolbar-btn toolbar-btn-outline text-xs sm:text-sm px-3 py-1.5 rounded transition-colors font-medium">Redo</button>
        <button id="resetBtn" class="text-xs sm:text-sm px-3 py-1.5 rounded border border-red-700 text-red-600 hover:bg-red-600 hover:text-white transition-colors font-medium ml-2">Reset</button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-6 sm:py-8">

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-4 gap-5">
      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-3">
          <h1 class="font-orbitron text-4xl sm:text-[2.75rem] font-black tracking-[0.08em] pl-2 drop-shadow-sm">DECRYPTO</h1>
          <span id="sideBadge" class="side-badge text-[11px] font-bold px-2.5 py-1 rounded border-game mb-1"></span>
        </div>
        <div class="flex items-center gap-2 pl-2">
          <span class="text-xs font-bold uppercase tracking-wide text-muted mr-1">My Team:</span>
          <div id="teamSwitch" class="team-switch">
            <div class="team-switch-thumb"></div>
            <button data-team="white" class="team-switch-option" id="pickWhiteBtn"><span class="team-swatch white-swatch"></span>White</button>
            <button data-team="black" class="team-switch-option" id="pickBlackBtn"><span class="team-swatch black-swatch"></span>Black</button>
          </div>
        </div>
      </div>

      <div class="border-game rounded-lg bg-panel flex flex-col w-full sm:w-[380px] overflow-hidden shadow-sm">
        <div class="flex h-7 border-b-game bg-panel">
          <div class="bg-alt pl-3 pr-2 flex items-center font-orbitron text-[11px] font-bold text-muted uppercase tracking-widest">TEAM</div>
          <div class="w-4 bg-alt slant-right border-r-game -ml-[1px]"></div>
        </div>
        <div class="px-3 py-2">
          <input id="teamName" type="text" autocomplete="off" spellcheck="false" class="line-input text-xl sm:text-2xl font-semibold uppercase">
        </div>
        <div id="teamContextBanner" class="border-t-game px-3 py-2 text-muted font-semibold"></div>
      </div>
    </div>

    <!-- Token Tracker Panel -->
    <div class="border-game rounded-lg bg-panel shadow-sm mb-6 overflow-hidden">
      <div class="flex h-7 border-b-game bg-panel">
        <div class="bg-alt pl-3 pr-2 flex items-center font-orbitron text-[11px] font-bold text-muted uppercase tracking-widest">TOKENS</div>
        <div class="w-4 bg-alt slant-right border-r-game -ml-[1px]"></div>
      </div>
      <div class="p-3 sm:p-4 flex flex-col sm:flex-row gap-4 sm:gap-8">
        <div class="flex items-center gap-3">
          <span class="text-xs font-bold uppercase tracking-wide text-muted w-[130px]">Miscommunication</span>
          <div id="miscommPips" class="flex gap-1.5"></div>
          <span id="miscommWarning" class="text-xs font-bold text-amber-600 hidden">2 = GAME OVER</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs font-bold uppercase tracking-wide text-muted w-[110px]">Interception</span>
          <div id="interceptPips" class="flex gap-1.5"></div>
          <span id="interceptWarning" class="text-xs font-bold text-red-600 hidden">2 = GAME OVER</span>
        </div>
      </div>
    </div>

    <div id="sheetContent">
      <div id="roundsWrap" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"></div>

      <div id="wordColsOuter" class="overflow-x-auto w-full border-game rounded-lg shadow-sm bg-panel">
        <div class="min-w-[600px] flex overflow-hidden">
          <div id="wordCols" class="flex-1 grid grid-cols-4"></div>
        </div>
      </div>
    </div>

  </main>

  <footer class="text-center pb-8 pt-4">
    <p class="text-xs font-semibold text-muted tracking-wide">Autosaved to this device · Codes are 1–4, exact match required — no partial credit</p>
  </footer>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "decrypto-sheet-state-v10";
  const LEGACY_KEYS = ["decrypto-sheet-state-v9","decrypto-sheet-state-v8","decrypto-sheet-state-v7","decrypto-sheet-state-v6","decrypto-sheet-state-v5"];
  const LEGACY_KEY_V4 = "decrypto-sheet-state-v4";
  const ROUNDS = 8;
  const MAX_HISTORY = 60;

  const MISCOMM_ICON = "https://www.ultraboardgames.com/decrypto/gfx/game14.jpg";
  const INTERCEPT_ICON = "https://www.ultraboardgames.com/decrypto/gfx/game13.jpg";

  function freshSideData(){
    return {
      rounds: Array.from({length: ROUNDS}, () => ({
        lines: [
          {text: "", a: "", b: ""},
          {text: "", a: "", b: ""},
          {text: "", a: "", b: ""}
        ]
      })),
      words: ["", "", "", ""]
    };
  }

  function freshState(){
    return {
      teamName: "",
      activeSide: "white",
      myTeam: null,
      sides: { white: freshSideData(), black: freshSideData() }
    };
  }

  function isValidState(parsed){
    return parsed && parsed.sides && parsed.sides.white && parsed.sides.black &&
           Array.isArray(parsed.sides.white.rounds) && Array.isArray(parsed.sides.black.rounds);
  }

  function stripCField(parsed){
    ["white", "black"].forEach(sideKey => {
      const side = parsed.sides[sideKey];
      if(!side || !Array.isArray(side.rounds)) return;
      side.rounds.forEach(r => {
        if(!r.lines) return;
        r.lines.forEach(ln => { if(ln.c !== undefined) delete ln.c; });
      });
    });
    if(parsed.myTeam === undefined) parsed.myTeam = null;
  }

  function loadInitial(){
    const tryKey = (key) => {
      try{
        const raw = localStorage.getItem(key);
        if(raw){
          const parsed = JSON.parse(raw);
          if(isValidState(parsed)){ stripCField(parsed); return parsed; }
        }
      }catch(e){ }
      return null;
    };

    let found = tryKey(STORAGE_KEY);
    if(found) return found;
    for(const k of LEGACY_KEYS){ found = tryKey(k); if(found) return found; }

    try{
      const legacyRaw = localStorage.getItem(LEGACY_KEY_V4);
      if(legacyRaw){
        const legacy = JSON.parse(legacyRaw);
        if(legacy && legacy.rounds && legacy.words){
          const migrated = freshState();
          migrated.teamName = legacy.teamName || "";
          migrated.sides.white.rounds = legacy.rounds.map(r => ({
            lines: r.lines.map(ln => ({ text: ln.text || "", a: ln.a || "", b: ln.b || "" }))
          }));
          migrated.sides.white.words = legacy.words;
          return migrated;
        }
      }
    }catch(e){ }

    return freshState();
  }

  let state = loadInitial();
  let history = [JSON.parse(JSON.stringify(state))];
  let histIdx = 0;

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ }
  }

  function commit(){
    history = history.slice(0, histIdx + 1);
    history.push(JSON.parse(JSON.stringify(state)));
    if(history.length > MAX_HISTORY){ history.shift(); }
    histIdx = history.length - 1;
    persist();
    updateToolbar();
  }

  function undo(){
    if(histIdx <= 0) return;
    histIdx -= 1;
    state = JSON.parse(JSON.stringify(history[histIdx]));
    persist();
    render();
    updateToolbar();
  }

  function redo(){
    if(histIdx >= history.length - 1) return;
    histIdx += 1;
    state = JSON.parse(JSON.stringify(history[histIdx]));
    persist();
    render();
    updateToolbar();
  }

  function resetAll(){
    state = freshState();
    history = [JSON.parse(JSON.stringify(state))];
    histIdx = 0;
    persist();
    render();
    updateToolbar();
  }

  function updateToolbar(){
    document.getElementById("undoBtn").disabled = histIdx <= 0;
    document.getElementById("redoBtn").disabled = histIdx >= history.length - 1;
  }

  function escapeAttr(str){
    return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function currentSideData(){ return state.sides[state.activeSide]; }
  function myTeamKey(){ return state.myTeam || "white"; }
  function otherTeamKey(){ return myTeamKey() === "white" ? "black" : "white"; }

  function updateDerivedWords() {
    const sideData = currentSideData();
    let newWords = ["", "", "", ""];
    for(let r = 0; r < ROUNDS; r++){
      for(let l = 0; l < 3; l++){
        const clue = sideData.rounds[r].lines[l].text.trim();
        const correctNum = sideData.rounds[r].lines[l].b.trim();
        if(clue && ["1", "2", "3", "4"].includes(correctNum)){
          const colIdx = parseInt(correctNum, 10) - 1;
          if(newWords[colIdx].length > 0){ newWords[colIdx] += "\n" + clue; }
          else { newWords[colIdx] = clue; }
        }
      }
    }
    sideData.words = newWords;
  }

  function digitsComplete(arr){
    return arr.length === 3 && arr.every(d => ["1","2","3","4"].includes(d));
  }
  function arraysEqual(a, b){
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }

  function roundOutcomeForSide(sideKey, rIdx){
    const lines = state.sides[sideKey].rounds[rIdx].lines;
    const guess = [lines[0].a, lines[1].a, lines[2].a];
    const code = [lines[0].b, lines[1].b, lines[2].b];
    const codeSet = digitsComplete(code);
    const guessSet = digitsComplete(guess);
    const out = { codeSet, guessSet, match: false };
    if(codeSet && guessSet){ out.match = arraysEqual(guess, code); }
    return out;
  }

  function sideRole(sideKey){
    return sideKey === myTeamKey() ? "mine" : "other";
  }

  function badgeHtml(rIdx){
    const sideKey = state.activeSide;
    const out = roundOutcomeForSide(sideKey, rIdx);
    if(!out.codeSet || !out.guessSet) return "";

    const role = sideRole(sideKey);
    if(role === "mine"){
      if(!out.match){
        return `<span class="round-result-badge" style="background:#d97706; color:#fff;"><img src="${MISCOMM_ICON}" class="w-4 h-4 rounded-full" alt=""> MISCOMM.</span>`;
      }
      return `<span class="round-result-badge" style="background:#16a34a; color:#fff;">✓ NO TOKEN</span>`;
    } else {
      if(out.match){
        return `<span class="round-result-badge" style="background:#dc2626; color:#fff;"><img src="${INTERCEPT_ICON}" class="w-4 h-4 rounded-full" alt=""> INTERCEPT</span>`;
      }
      return `<span class="round-result-badge" style="background:#6b7280; color:#fff;">— NO TOKEN</span>`;
    }
  }

  function roundPanel(rIdx){
    const label = "ROUND " + String(rIdx + 1).padStart(2, "0");
    const r = currentSideData().rounds[rIdx];

    const lines = r.lines.map((ln, li) => {
      const bgClass = li === 1 ? 'bg-alt' : 'bg-panel';
      return `
        <div class="flex items-center px-2 py-2 ${bgClass}">
          <input type="text" maxlength="30" data-round="${rIdx}" data-line="${li}" data-field="text" autocomplete="off" spellcheck="false"
            class="line-input" value="${escapeAttr(ln.text)}">
          <div class="flex gap-1.5 sm:gap-2 ml-3 flex-shrink-0">
            <input type="text" maxlength="1" data-round="${rIdx}" data-line="${li}" data-field="a" autocomplete="off" inputmode="numeric"
              class="sq-input" value="${escapeAttr(ln.a)}" title="Guessed digit">
            <input type="text" maxlength="1" data-round="${rIdx}" data-line="${li}" data-field="b" autocomplete="off" inputmode="numeric"
              class="sq-input" value="${escapeAttr(ln.b)}" title="Correct code digit">
          </div>
        </div>
      `;
    }).join("");

    const badge = badgeHtml(rIdx);

    return `
      <div class="border-game rounded-lg overflow-hidden bg-panel flex flex-col shadow-sm relative">
        <div class="flex justify-between items-end border-b-game bg-panel">
           <div class="flex h-7 relative z-10">
              <div class="bg-alt pl-3 pr-2 flex items-center font-orbitron text-[11.5px] font-bold tracking-widest text-muted uppercase">
                 ${label}
              </div>
              <div class="w-4 bg-alt slant-right border-r-game -ml-[1px]"></div>
           </div>
           <div class="flex gap-1.5 sm:gap-2 pr-2 pb-1 text-muted">
              <span class="w-[28px] text-center text-[13px] font-bold font-orbitron">?</span>
              <span class="w-[28px] text-center flex justify-center">
                 <svg class="w-[18px] h-[18px] mt-[2px]" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5.41c0-.53-.21-1.04-.59-1.41l-2-2A1.99 1.99 0 0 0 17.59 3zM12 19c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm1-10H7V5h6v4z"/></svg>
              </span>
           </div>
        </div>
        <div class="flex flex-col">
           ${lines}
        </div>
        <div class="round-badge-row px-3 py-1.5 min-h-[28px] border-t-game flex items-center gap-1">${badge}</div>
      </div>
    `;
  }

  function renderRounds(){
    document.getElementById("roundsWrap").innerHTML = Array.from({length: ROUNDS}, (_, i) => roundPanel(i)).join("");
  }

  function renderCodesSection(){
    const sideData = currentSideData();
    document.getElementById("wordCols").innerHTML = [0, 1, 2, 3].map(i => {
      const isGrey = i % 2 === 1;
      const bgClass = isGrey ? 'bg-alt' : 'bg-panel';
      const borderRight = i < 3 ? 'border-r-game' : '';
      return `
        <div class="flex flex-col ${bgClass} ${borderRight}">
           <div class="flex h-7 border-b-game bg-panel">
              <div class="${bgClass} pl-3 pr-2 flex items-center font-orbitron text-[11px] font-bold text-muted tracking-widest uppercase">
                 <svg class="w-3.5 h-3.5 inline-block mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4h2.35v3h4v-3h2v-4h-8.35zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                 ${i + 1}
              </div>
              <div class="w-4 ${bgClass} slant-right border-r-game -ml-[1px]"></div>
              <div class="flex-1 bg-panel"></div>
           </div>
           <div class="flex-1 p-2.5">
              <textarea readonly data-wordcol="${i}" spellcheck="false" class="w-full h-full bg-transparent resize-none outline-none text-sm font-semibold uppercase leading-8 cursor-default" rows="6">${escapeAttr(sideData.words[i])}</textarea>
           </div>
        </div>
      `;
    }).join("");
  }

  function renderTeamSwitch(){
    const sw = document.getElementById("teamSwitch");
    sw.classList.toggle("chosen", !!state.myTeam);
    sw.classList.toggle("pos-black", state.myTeam === "black");
    document.getElementById("pickWhiteBtn").classList.toggle("selected", state.myTeam === "white");
    document.getElementById("pickBlackBtn").classList.toggle("selected", state.myTeam === "black");
  }

  function renderSideChrome(){
    const isBlack = state.activeSide === "black";
    document.body.classList.toggle("side-black", isBlack);
    const sideLabelBadge = document.getElementById("sideBadge");
    sideLabelBadge.textContent = isBlack ? "SIDE · BLACK" : "SIDE · WHITE";

    const banner = document.getElementById("teamContextBanner");

    if(!state.myTeam){
      banner.innerHTML = `👆 Choose your team's colour above so this sheet knows when to track Miscommunication vs Interception.`;
    } else {
      const role = sideRole(state.activeSide);
      banner.innerHTML = role === "mine"
        ? `🤝 <strong>My Team</strong> side sheet`
        : `🕵️ <strong>Opponent's</strong> side sheet`;
    }
  }

  function renderPips(containerId, count, iconUrl){
    const el = document.getElementById(containerId);
    let pips = "";
    const total = Math.max(count, 2);
    for(let i = 0; i < total; i++){
      pips += i < count
        ? `<img src="${iconUrl}" class="token-icon-img" alt="token">`
        : `<span class="token-slot-empty"></span>`;
    }
    el.innerHTML = pips;
  }

  function renderTokenPanel(){
    let miscomm = 0, intercept = 0;
    const mine = myTeamKey(), other = otherTeamKey();
    for(let r = 0; r < ROUNDS; r++){
      const mineOut = roundOutcomeForSide(mine, r);
      if(mineOut.codeSet && mineOut.guessSet && !mineOut.match) miscomm++;
      const otherOut = roundOutcomeForSide(other, r);
      if(otherOut.codeSet && otherOut.guessSet && otherOut.match) intercept++;
    }
    renderPips("miscommPips", miscomm, MISCOMM_ICON);
    renderPips("interceptPips", intercept, INTERCEPT_ICON);
    document.getElementById("miscommWarning").classList.toggle("hidden", miscomm < 2);
    document.getElementById("interceptWarning").classList.toggle("hidden", intercept < 2);
  }

  function render(){
    document.getElementById("teamName").value = state.teamName;
    updateDerivedWords();
    renderRounds();
    renderCodesSection();
    renderSideChrome();
    renderTeamSwitch();
    renderTokenPanel();
  }

  function flipSide(){
    const content = document.getElementById("sheetContent");
    content.classList.add("flipping");
    setTimeout(() => {
      state.activeSide = state.activeSide === "white" ? "black" : "white";
      persist();
      render();
      content.classList.remove("flipping");
    }, 160);
  }

  /* ---- EVENTS ---- */

  document.getElementById("roundsWrap").addEventListener("input", function(e){
    const el = e.target;
    if(el.dataset.field !== 'a' && el.dataset.field !== 'b') return;
    el.value = el.value.replace(/[^1-4]/g, "").slice(0,1);

    const rIdx = parseInt(el.dataset.round, 10);
    const li = parseInt(el.dataset.line, 10);
    currentSideData().rounds[rIdx].lines[li][el.dataset.field] = el.value;

    if(el.value && el.dataset.field === 'a'){
      const next = document.querySelector(`[data-round="${rIdx}"][data-line="${li}"][data-field="b"]`);
      if(next) next.focus();
    }

    const panel = document.querySelectorAll('#roundsWrap > div')[rIdx];
    if(panel){
      const badgeRow = panel.querySelector('.round-badge-row');
      if(badgeRow) badgeRow.innerHTML = badgeHtml(rIdx);
    }
    if(el.dataset.field === 'b'){
      updateDerivedWords();
      renderCodesSection();
    }
    renderTokenPanel();
  });

  document.getElementById("roundsWrap").addEventListener("change", function(e){
    const el = e.target;
    if(el.dataset.round === undefined) return;
    const rIdx = parseInt(el.dataset.round, 10);

    if(el.dataset.line !== undefined && el.dataset.field !== undefined){
      const li = parseInt(el.dataset.line, 10);
      currentSideData().rounds[rIdx].lines[li][el.dataset.field] = el.value;
      commit();
    }
  });

  document.getElementById("teamName").addEventListener("change", function(e){
    state.teamName = e.target.value;
    commit();
  });

  document.getElementById("teamSwitch").addEventListener("click", function(e){
    const btn = e.target.closest("[data-team]");
    if(!btn) return;
    state.myTeam = btn.dataset.team;
    renderTeamSwitch();
    renderSideChrome();
    renderRounds();
    renderTokenPanel();
    commit();
  });

  document.getElementById("flipBtn").addEventListener("click", flipSide);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  document.getElementById("resetBtn").addEventListener("click", function(){
    if(confirm("Reset both sides of the sheet and all token progress? This clears everything.")){
      resetAll();
    }
  });

  window.addEventListener("keydown", function(e){
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    if(e.key.toLowerCase() === "z" && !e.shiftKey){ e.preventDefault(); undo(); }
    else if((e.key.toLowerCase() === "z" && e.shiftKey) || e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); }
    else if(e.key.toLowerCase() === "f"){ e.preventDefault(); flipSide(); }
  });

  render();
  updateToolbar();
})();
</script>
</body>
</html>
