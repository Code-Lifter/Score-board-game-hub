<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decrypto — Digital Score Sheet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #d9dbde;
    --bg-panel: #ffffff;
    --bg-alt: #cfd1d5;
    --line: #4f5359;
    --line-width: 2px;
    --text-main: #111111;
    --text-muted: #4b5563;
  }

  body {
    background: var(--bg-page);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    transition: background 0.35s ease;
    overflow-x: clip;
  }

  body.side-black {
    --bg-page: #16171a;
    --bg-panel: #0e0f11;
    --bg-alt: #232529;
    --line: #cfd1d5;
    --text-main: #f2f2f2;
    --text-muted: #b8bcc2;
  }

  .font-orbitron { font-family: 'Orbitron', sans-serif; }

  .border-game { border: var(--line-width) solid var(--line); }
  .border-b-game { border-bottom: var(--line-width) solid var(--line); }
  .border-r-game { border-right: var(--line-width) solid var(--line); }
  .border-t-game { border-top: var(--line-width) solid var(--line); }

  .bg-alt { background-color: var(--bg-alt); }
  .bg-panel { background-color: var(--bg-panel); }

  .text-main { color: var(--text-main); }
  .text-muted { color: var(--text-muted); }

  .line-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid transparent;
    outline: none;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    transition: border-color 0.2s;
    color: var(--text-main);
    min-width: 0;
  }
  .line-input:focus { border-bottom-color: rgba(128,128,128,0.5); }

  .sq-input {
    width: 28px;
    height: 28px;
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px solid var(--line);
    box-shadow: inset 1.5px 1.5px 4px rgba(0,0,0,0.15);
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    border-radius: 2px;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .sq-input:focus { outline: none; border-width: 2px; }
  .sq-input.dup { border-color: #dc2626; background: rgba(220,38,38,0.14); }
  .sq-input:disabled {
    cursor: not-allowed;
    opacity: 0.45;
    background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(128,128,128,0.28) 4px 6px);
  }

  .slant-right { transform: skewX(-25deg); transform-origin: bottom left; }

  .toolbar-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .toolbar-btn-outline { border: 1px solid var(--line); color: var(--text-main); }
  .toolbar-btn-outline:hover:not(:disabled) { background: var(--bg-alt); }

  #flipBtn { background: var(--text-main); color: var(--bg-page); }
  #flipBtn:hover { opacity: 0.85; }

  .side-badge { font-family: 'Orbitron', sans-serif; letter-spacing: 0.12em; }

  /* ---------- PAPER FLIP ---------- */
  #paper { position: relative; transform-origin: 50% 50%; will-change: transform; }
  #paper.is-flipping {
    background: var(--bg-page);
    border-radius: 14px;
    box-shadow: 0 28px 60px rgba(0,0,0,0.30), 0 4px 12px rgba(0,0,0,0.15);
    pointer-events: none;
  }
  .paper-shade {
    position: absolute; inset: 0; z-index: 5;
    border-radius: 14px; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.30), rgba(0,0,0,0.05) 45%, rgba(255,255,255,0.08) 55%, rgba(0,0,0,0.24));
  }

  /* ---------- ROUNDS ---------- */
  .round-result-badge {
    font-size: 10.5px; font-weight: 700;
    padding: 2px 7px 2px 5px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .current-round { outline: 2.5px solid var(--text-main); outline-offset: 2px; }
  .now-tag {
    font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    padding: 1px 6px; border-radius: 999px; margin-left: 8px;
    background: var(--text-main); color: var(--bg-panel);
  }

  .clue-row { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px dashed rgba(128,128,128,0.35); }
  .clue-row:last-child { border-bottom: none; }
  .clue-round { font-family: 'Orbitron', sans-serif; font-size: 9.5px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; width: 22px; }
  .clue-text { font-size: 14px; font-weight: 600; text-transform: uppercase; word-break: break-word; }

  #teamContextBanner { font-size: 11.5px; line-height: 1.45; }

  /* ---------- TEAM SWITCH + LOCK ---------- */
  .team-switch {
    position: relative;
    display: inline-flex;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--bg-panel);
  }
  .team-switch-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: calc(50% - 3px);
    height: calc(100% - 6px);
    border-radius: 999px;
    background: var(--text-main);
    transition: transform 0.25s ease, opacity 0.2s ease;
    z-index: 0;
    opacity: 0;
  }
  .team-switch.chosen .team-switch-thumb { opacity: 1; }
  .team-switch.pos-black .team-switch-thumb { transform: translateX(100%); }
  .team-switch-option {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    background: transparent; border: none; cursor: pointer;
    color: var(--text-main);
    transition: color 0.2s ease, opacity 0.2s ease;
  }
  .team-switch-option.selected { color: var(--bg-panel); }
  .team-switch.locked .team-switch-option { cursor: default; }
  .team-switch.locked .team-switch-option:not(.selected) { opacity: 0.3; cursor: not-allowed; }
  .team-switch.just-locked { animation: lockIn 0.45s ease; }
  .team-switch.shake { animation: shake 0.35s ease; }
  .team-swatch {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid var(--line); flex-shrink: 0;
  }
  .team-swatch.white-swatch { background: #ffffff; }
  .team-swatch.black-swatch { background: #111214; }

  .lock-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 6px 11px; border-radius: 999px;
    border: 1.5px solid var(--line); color: var(--text-main); background: var(--bg-panel);
    transition: background 0.15s;
  }
  .lock-btn[hidden] { display: none; }
  .lock-btn:hover { background: var(--bg-alt); }
  .lock-btn.shake { animation: shake 0.35s ease; }

  /* ---------- TOKENS ---------- */
  .token { display: inline-block; border-radius: 50%; overflow: hidden; flex-shrink: 0; vertical-align: middle; }
  .token img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .token.miscomm { background: radial-gradient(circle at 35% 30%, #3a3c40, #0b0c0d); }
  .token.intercept { background: radial-gradient(circle at 35% 30%, #ffffff, #c9cbcf); border: 1px solid #9ca3af; }
  .token-lg, .token-slot-empty { width: 5rem; height: 5rem; }
  .token-sm { width: 1rem; height: 1rem; }
  .token-slot-empty { border-radius: 50%; border: 2px dashed var(--line); opacity: 0.5; display: inline-block; }
  .token.pop { animation: tokenPop 0.5s cubic-bezier(.2,.8,.3,1.2); }
  #tokensPanel { transition: opacity 0.2s; }
  #tokensPanel.inactive { opacity: 0.5; }

  @keyframes tokenPop { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes lockIn { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  @media (prefers-reduced-motion: reduce) {
    .token.pop, .team-switch.just-locked, .team-switch.shake, .lock-btn.shake { animation: none; }
  }

  /* ---------- MOBILE LAYOUT ---------- */
  @media (max-width: 767px) {
    #roundsWrap {
      display: flex !important;
      flex-wrap: nowrap !important;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-left: 12px;
      -webkit-overflow-scrolling: touch;
      gap: 12px !important;
      padding: 5px 5px 8px;
    }
    #roundsWrap > div {
      flex: 0 0 87%;
      scroll-snap-align: center;
    }
    #wordColsOuter > div { min-width: 0 !important; }
    #wordCols { grid-template-columns: 1fr !important; }
    #wordCols > div {
      border-right: none !important;
      border-bottom: var(--line-width) solid var(--line);
    }
    #wordCols > div:last-child { border-bottom: none; }
    .token-lg, .token-slot-empty { width: 3.5rem; height: 3.5rem; }
  }
</style>
</head>
<body class="min-h-screen">

  <div class="w-full border-b border-gray-400 sticky top-0 z-50 shadow-sm" style="background: var(--bg-page); backdrop-filter: blur(4px);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="text-xs sm:text-sm text-muted hover:opacity-70 font-semibold flex items-center gap-1 transition-colors">
        <span aria-hidden="true">←</span> Home
      </a>
      <div class="flex items-center gap-2 flex-wrap">
        <button id="flipBtn" class="text-xs sm:text-sm px-3 py-1.5 rounded font-bold flex items-center gap-1.5 transition-colors" title="Flip sheet (F)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L20 4M8 21H3v-5M20 4L4 20"/></svg>
          <span id="flipLabel">Flip Sheet</span>
        </button>
        <button id="undoBtn" class="toolbar-btn toolbar-btn-outline text-xs sm:text-sm px-3 py-1.5 rounded transition-colors font-medium" title="Undo (Ctrl/⌘+Z)">Undo</button>
        <button id="redoBtn" class="toolbar-btn toolbar-btn-outline text-xs sm:text-sm px-3 py-1.5 rounded transition-colors font-medium" title="Redo (Ctrl/⌘+Shift+Z)">Redo</button>
        <button id="resetBtn" class="text-xs sm:text-sm px-3 py-1.5 rounded border border-red-700 text-red-600 hover:bg-red-600 hover:text-white transition-colors font-medium ml-2">Reset</button>
      </div>
    </div>
  </div>

  <main id="paper" class="max-w-7xl mx-auto px-3 sm:px-6 py-6 sm:py-8">
    <div class="paper-shade" aria-hidden="true"></div>

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-4 gap-5">
      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-3">
          <h1 class="font-orbitron text-4xl sm:text-[2.75rem] font-black tracking-[0.08em] pl-2 drop-shadow-sm">DECRYPTO</h1>
          <span id="sideBadge" class="side-badge text-[11px] font-bold px-2.5 py-1 rounded border-game mb-1"></span>
        </div>
        <div class="flex items-center gap-2 pl-2 flex-wrap">
          <span class="text-xs font-bold uppercase tracking-wide text-muted mr-1">My Team:</span>
          <div id="teamSwitch" class="team-switch">
            <div class="team-switch-thumb"></div>
            <button data-team="white" class="team-switch-option" id="pickWhiteBtn"><span class="team-swatch white-swatch"></span>White</button>
            <button data-team="black" class="team-switch-option" id="pickBlackBtn"><span class="team-swatch black-swatch"></span>Black</button>
          </div>
          <button id="lockBtn" class="lock-btn" hidden title="Team locked in — click to change">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 1 1 6 0v3H9z"/></svg>
            Locked
          </button>
        </div>
      </div>

      <div class="border-game rounded-lg bg-panel flex flex-col w-full sm:w-[380px] overflow-hidden shadow-sm">
        <div class="flex h-7 border-b-game bg-panel">
          <div class="bg-alt pl-3 pr-2 flex items-center font-orbitron text-[11px] font-bold text-muted uppercase tracking-widest">TEAM</div>
          <div class="w-4 bg-alt slant-right border-r-game -ml-[1px]"></div>
        </div>
        <div class="px-3 py-2">
          <input id="teamName" type="text" autocomplete="off" spellcheck="false" class="line-input text-xl sm:text-2xl font-semibold uppercase">
        </div>
        <div id="teamContextBanner" class="border-t-game px-3 py-2 text-muted font-semibold"></div>
      </div>
    </div>

    <!-- Token Tracker Panel -->
    <div id="tokensPanel" class="border-game rounded-lg bg-panel shadow-sm mb-6 overflow-hidden">
      <div class="flex h-7 border-b-game bg-panel">
        <div class="bg-alt pl-3 pr-2 flex items-center font-orbitron text-[11px] font-bold text-muted uppercase tracking-widest">TOKENS</div>
        <div class="w-4 bg-alt slant-right border-r-game -ml-[1px]"></div>
        <div id="tokensHint" class="flex-1 flex items-center justify-end pr-3 text-[11px] font-semibold text-muted"></div>
      </div>
      <div class="p-3 sm:p-4 flex flex-col sm:flex-row gap-4 sm:gap-10">
        <div class="flex items-center gap-3">
          <div class="w-[140px]">
            <div class="text-xs font-bold uppercase tracking-wide">Miscommunications</div>
            <div class="text-[11px] font-semibold text-muted">2 = your team loses</div>
          </div>
          <div id="miscommPips" class="flex gap-1.5"></div>
          <span id="miscommWarning" class="text-xs font-bold text-amber-600 hidden">YOU LOSE</span>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-[140px]">
            <div class="text-xs font-bold uppercase tracking-wide">Interceptions</div>
            <div class="text-[11px] font-semibold text-muted">2 = your team wins</div>
          </div>
          <div id="interceptPips" class="flex gap-1.5"></div>
          <span id="interceptWarning" class="text-xs font-bold text-green-600 hidden">YOU WIN</span>
        </div>
      </div>
    </div>

    <div id="sheetContent">
      <div id="roundsWrap" class="relative grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"></div>

      <div id="wordColsOuter" class="overflow-x-auto w-full border-game rounded-lg shadow-sm bg-panel">
        <div class="min-w-[600px] flex overflow-hidden">
          <div id="wordCols" class="flex-1 grid grid-cols-4"></div>
        </div>
      </div>
    </div>

  </main>

  <footer class="text-center pb-8 pt-4 px-4">
    <p class="text-xs font-semibold text-muted tracking-wide">Autosaved to this device · Codes are 3 different digits from 1–4, exact match required · Press F to flip</p>
  </footer>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "decrypto-sheet-state-v11";
  const LEGACY_KEYS = ["decrypto-sheet-state-v10","decrypto-sheet-state-v9","decrypto-sheet-state-v8","decrypto-sheet-state-v7","decrypto-sheet-state-v6","decrypto-sheet-state-v5"];
  const LEGACY_KEY_V4 = "decrypto-sheet-state-v4";
  const ROUNDS = 8;
  const MAX_HISTORY = 80;
  const DIGITS = ["1","2","3","4"];
  const FOCUS_ORDER = [["a",0],["a",1],["a",2],["b",0],["b",1],["b",2]];

  const MISCOMM_ICON = "https://www.ultraboardgames.com/decrypto/gfx/game12.jpg";
  const INTERCEPT_ICON = "https://www.ultraboardgames.com/decrypto/gfx/game11.jpg";

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const mobileQuery = window.matchMedia("(max-width: 767px)");
  const clone = o => JSON.parse(JSON.stringify(o));

  let isFlipping = false;
  let lastTokens = { miscomm: null, intercept: null };

  /* ---------- STATE ---------- */

  function freshSideData(){
    return {
      rounds: Array.from({length: ROUNDS}, () => ({
        lines: [
          {text: "", a: "", b: ""},
          {text: "", a: "", b: ""},
          {text: "", a: "", b: ""}
        ]
      }))
    };
  }

  function freshState(){
    return {
      teamName: "",
      activeSide: "white",
      myTeam: null,
      sides: { white: freshSideData(), black: freshSideData() }
    };
  }

  function isValidState(parsed){
    return parsed && parsed.sides && parsed.sides.white && parsed.sides.black &&
           Array.isArray(parsed.sides.white.rounds) && Array.isArray(parsed.sides.black.rounds);
  }

  function normalize(parsed){
    ["white", "black"].forEach(sideKey => {
      const side = parsed.sides[sideKey];
      delete side.words;
      side.rounds.forEach(r => {
        if(!r.lines) return;
        r.lines.forEach(ln => { if(ln.c !== undefined) delete ln.c; });
      });
    });
    if(parsed.myTeam !== "white" && parsed.myTeam !== "black") parsed.myTeam = null;
    if(parsed.activeSide !== "white" && parsed.activeSide !== "black") parsed.activeSide = "white";
    if(typeof parsed.teamName !== "string") parsed.teamName = "";
    return parsed;
  }

  function loadInitial(){
    const tryKey = (key) => {
      try{
        const raw = localStorage.getItem(key);
        if(raw){
          const parsed = JSON.parse(raw);
          if(isValidState(parsed)) return normalize(parsed);
        }
      }catch(e){ }
      return null;
    };

    let found = tryKey(STORAGE_KEY);
    if(found) return found;
    for(const k of LEGACY_KEYS){ found = tryKey(k); if(found) return found; }

    try{
      const legacyRaw = localStorage.getItem(LEGACY_KEY_V4);
      if(legacyRaw){
        const legacy = JSON.parse(legacyRaw);
        if(legacy && legacy.rounds){
          const migrated = freshState();
          migrated.teamName = legacy.teamName || "";
          migrated.sides.white.rounds = legacy.rounds.map(r => ({
            lines: r.lines.map(ln => ({ text: ln.text || "", a: ln.a || "", b: ln.b || "" }))
          }));
          return migrated;
        }
      }
    }catch(e){ }

    return freshState();
  }

  let state = loadInitial();

  /* History only tracks sheet content. Team lock and which side is showing are
     not undoable, but undo/redo jumps to the side where the change happened. */
  function snap(){
    return { data: clone({ teamName: state.teamName, sides: state.sides }), side: state.activeSide };
  }
  let history = [snap()];
  let histIdx = 0;

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ }
  }

  function commit(){
    history = history.slice(0, histIdx + 1);
    history.push(snap());
    if(history.length > MAX_HISTORY){ history.shift(); }
    histIdx = history.length - 1;
    persist();
    updateToolbar();
  }

  function restore(entry, side){
    const changesSide = side !== state.activeSide;
    const apply = () => {
      state.teamName = entry.data.teamName;
      state.sides = clone(entry.data.sides);
      state.activeSide = side;
      persist();
      render();
      updateToolbar();
      if(changesSide) scrollToCurrent();
    };
    if(changesSide) flipAnimate(apply); else apply();
  }

  function undo(){
    if(isFlipping || histIdx <= 0) return;
    const sideOfChange = history[histIdx].side;
    histIdx -= 1;
    restore(history[histIdx], sideOfChange);
  }

  function redo(){
    if(isFlipping || histIdx >= history.length - 1) return;
    histIdx += 1;
    restore(history[histIdx], history[histIdx].side);
  }

  function resetAll(){
    state = freshState();
    history = [snap()];
    histIdx = 0;
    lastTokens = { miscomm: null, intercept: null };
    persist();
    render();
    updateToolbar();
    scrollToCurrent();
  }

  function updateToolbar(){
    document.getElementById("undoBtn").disabled = histIdx <= 0;
    document.getElementById("redoBtn").disabled = histIdx >= history.length - 1;
  }

  /* ---------- HELPERS ---------- */

  function escapeHtml(str){
    return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function currentSideData(){ return state.sides[state.activeSide]; }
  function otherSide(side){ return side === "white" ? "black" : "white"; }

  function complete(arr){ return arr.length === 3 && arr.every(d => DIGITS.includes(d)); }

  function dupSet(arr){
    const seen = new Set(), dups = new Set();
    arr.forEach(v => { if(!v) return; if(seen.has(v)) dups.add(v); seen.add(v); });
    return dups;
  }

  /* Decrypto rule: no interception attempts in Round 1. */
  function noIntercept(side, rIdx){
    return !!state.myTeam && side !== state.myTeam && rIdx === 0;
  }

  function roundOutcome(side, rIdx){
    const lines = state.sides[side].rounds[rIdx].lines;
    const guess = lines.map(l => l.a);
    const code = lines.map(l => l.b);
    const codeDup = dupSet(code).size > 0;
    const guessDup = dupSet(guess).size > 0;
    const codeOk = complete(code) && !codeDup;
    const guessOk = complete(guess) && !noIntercept(side, rIdx);
    return { codeOk, guessOk, codeDup, guessDup, match: codeOk && guessOk && guess.every((g, i) => g === code[i]) };
  }

  function currentRoundIdx(side){
    const rounds = state.sides[side].rounds;
    for(let r = 0; r < ROUNDS; r++){
      if(!complete(rounds[r].lines.map(l => l.b))) return r;
    }
    return -1;
  }

  function tokenHtml(kind, sizeClass, extra){
    const url = kind === "miscomm" ? MISCOMM_ICON : INTERCEPT_ICON;
    return `<span class="token ${kind} ${sizeClass} ${extra || ""}"><img src="${url}" alt="" onerror="this.remove()"></span>`;
  }

  function pill(bg, inner){
    return `<span class="round-result-badge" style="background:${bg}; color:#fff;">${inner}</span>`;
  }

  /* ---------- RENDERING ---------- */

  function badgeHtml(rIdx){
    const side = state.activeSide;
    const o = roundOutcome(side, rIdx);

    if(o.codeDup) return pill("#dc2626", "⚠ Code digits must all differ");
    if(noIntercept(side, rIdx)) return `<span class="text-[11px] font-semibold text-muted">No interception in Round 1 — just log their clues</span>`;
    if(o.guessDup) return pill("#b45309", "⚠ Guess repeats a digit");
    if(!o.codeOk || !o.guessOk) return "";

    if(!state.myTeam){
      return o.match ? pill("#16a34a", "✓ Match") : pill("#6b7280", "✗ No match");
    }
    if(side === state.myTeam){
      return o.match
        ? pill("#16a34a", "✓ Decoded — no token")
        : pill("#111214", tokenHtml("miscomm", "token-sm") + " Miscommunication");
    }
    return o.match
      ? pill("#2563eb", tokenHtml("intercept", "token-sm") + " Intercepted!")
      : pill("#6b7280", "— Not intercepted");
  }

  function roundPanel(rIdx){
    const side = state.activeSide;
    const label = "ROUND " + String(rIdx + 1).padStart(2, "0");
    const r = state.sides[side].rounds[rIdx];
    const blockA = noIntercept(side, rIdx);
    const dupA = dupSet(r.lines.map(l => l.a));
    const dupB = dupSet(r.lines.map(l => l.b));
    const isCurrent = rIdx === currentRoundIdx(side);

    const lines = r.lines.map((ln, li) => {
      const bgClass = li === 1 ? "bg-alt" : "bg-panel";
      return `
        <div class="flex items-center px-2 py-2 ${bgClass}">
          <input type="text" maxlength="30" data-round="${rIdx}" data-line="${li}" data-field="text" autocomplete="off" spellcheck="false" enterkeyhint="next"
            class="line-input" value="${escapeHtml(ln.text)}" aria-label="Round ${rIdx + 1} clue ${li + 1}">
          <div class="flex gap-1.5 sm:gap-2 ml-3 flex-shrink-0">
            <input type="text" maxlength="1" data-round="${rIdx}" data-line="${li}" data-field="a" autocomplete="off" inputmode="numeric"
              class="sq-input ${dupA.has(ln.a) ? "dup" : ""}" value="${blockA ? "" : escapeHtml(ln.a)}" ${blockA ? "disabled" : ""}
              title="${blockA ? "No interception in Round 1" : "Guessed digit"}" aria-label="Round ${rIdx + 1} line ${li + 1} guess">
            <input type="text" maxlength="1" data-round="${rIdx}" data-line="${li}" data-field="b" autocomplete="off" inputmode="numeric"
              class="sq-input ${dupB.has(ln.b) ? "dup" : ""}" value="${escapeHtml(ln.b)}" title="Correct code digit" aria-label="Round ${rIdx + 1} line ${li + 1} code">
          </div>
        </div>
      `;
    }).join("");

    return `
      <div data-panel="${rIdx}" class="border-game rounded-lg overflow-hidden bg-panel flex flex-col shadow-sm relative ${isCurrent ? "current-round" : ""}">
        <div class="flex justify-between items-end border-b-game bg-panel">
           <div class="flex h-7 relative z-10 items-center">
              <div class="bg-alt pl-3 pr-2 h-full flex items-center font-orbitron text-[11.5px] font-bold tracking-widest text-muted uppercase">${label}</div>
              <div class="w-4 h-full bg-alt slant-right border-r-game -ml-[1px]"></div>
              <span class="now-tag ${isCurrent ? "" : "hidden"}">NOW</span>
           </div>
           <div class="flex gap-1.5 sm:gap-2 pr-2 pb-1 text-muted">
              <span class="w-[28px] text-center text-[13px] font-bold font-orbitron">?</span>
              <span class="w-[28px] text-center flex justify-center">
                 <svg class="w-[18px] h-[18px] mt-[2px]" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5.41c0-.53-.21-1.04-.59-1.41l-2-2A1.99 1.99 0 0 0 17.59 3zM12 19c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm1-10H7V5h6v4z"/></svg>
              </span>
           </div>
        </div>
        <div class="flex flex-col">${lines}</div>
        <div class="round-badge-row px-3 py-1.5 min-h-[28px] border-t-game flex items-center gap-1">${badgeHtml(rIdx)}</div>
      </div>
    `;
  }

  function renderRounds(){
    document.getElementById("roundsWrap").innerHTML = Array.from({length: ROUNDS}, (_, i) => roundPanel(i)).join("");
  }

  /* Refresh one round's warnings/badge in place, without stealing focus. */
  function refreshRound(rIdx){
    const panel = document.querySelector(`#roundsWrap > [data-panel="${rIdx}"]`);
    if(!panel) return;
    const r = currentSideData().rounds[rIdx];
    ["a", "b"].forEach(f => {
      const dups = dupSet(r.lines.map(l => l[f]));
      panel.querySelectorAll(`[data-field="${f}"]`).forEach(inp => {
        inp.classList.toggle("dup", dups.has(r.lines[+inp.dataset.line][f]));
      });
    });
    panel.querySelector(".round-badge-row").innerHTML = badgeHtml(rIdx);
  }

  function refreshCurrentMarker(){
    const cur = currentRoundIdx(state.activeSide);
    document.querySelectorAll("#roundsWrap > [data-panel]").forEach(p => {
      const on = +p.dataset.panel === cur;
      p.classList.toggle("current-round", on);
      p.querySelector(".now-tag").classList.toggle("hidden", !on);
    });
  }

  function computeWords(sideData){
    const cols = [[], [], [], []];
    sideData.rounds.forEach((round, r) => {
      round.lines.forEach(ln => {
        const clue = ln.text.trim();
        if(clue && DIGITS.includes(ln.b)) cols[+ln.b - 1].push({ r, text: clue });
      });
    });
    return cols;
  }

  function renderCodesSection(){
    const cols = computeWords(currentSideData());
    document.getElementById("wordCols").innerHTML = cols.map((items, i) => {
      const bgClass = i % 2 === 1 ? "bg-alt" : "bg-panel";
      const borderRight = i < 3 ? "border-r-game" : "";
      const list = items.length
        ? items.map(it => `<div class="clue-row"><span class="clue-round">R${it.r + 1}</span><span class="clue-text">${escapeHtml(it.text)}</span></div>`).join("")
        : `<div class="text-xs font-semibold text-muted opacity-60 pt-1">No clues yet</div>`;
      return `
        <div class="flex flex-col ${bgClass} ${borderRight}">
           <div class="flex h-7 border-b-game bg-panel">
              <div class="${bgClass} pl-3 pr-2 flex items-center font-orbitron text-[11px] font-bold text-muted tracking-widest uppercase">
                 <svg class="w-3.5 h-3.5 inline-block mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4h2.35v3h4v-3h2v-4h-8.35zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                 ${i + 1}
              </div>
              <div class="w-4 ${bgClass} slant-right border-r-game -ml-[1px]"></div>
              <div class="flex-1 bg-panel flex items-center justify-end pr-2 text-[10px] font-bold text-muted">${items.length ? items.length : ""}</div>
           </div>
           <div class="flex-1 px-3 py-2 min-h-[11rem]">${list}</div>
        </div>
      `;
    }).join("");
  }

  function renderTeamSwitch(){
    const sw = document.getElementById("teamSwitch");
    const locked = !!state.myTeam;
    sw.classList.toggle("chosen", locked);
    sw.classList.toggle("locked", locked);
    sw.classList.toggle("pos-black", state.myTeam === "black");
    ["white", "black"].forEach(t => {
      const btn = document.getElementById(t === "white" ? "pickWhiteBtn" : "pickBlackBtn");
      btn.classList.toggle("selected", state.myTeam === t);
      btn.setAttribute("aria-disabled", locked ? "true" : "false");
      btn.setAttribute("aria-pressed", state.myTeam === t ? "true" : "false");
      btn.title = locked ? "Team is locked in — use the Locked button to change" : `Lock in ${t === "white" ? "White" : "Black"} as your team`;
    });
    document.getElementById("lockBtn").hidden = !locked;
  }

  function renderSideChrome(){
    const side = state.activeSide;
    document.body.classList.toggle("side-black", side === "black");
    document.getElementById("sideBadge").textContent = side === "black" ? "SIDE · BLACK" : "SIDE · WHITE";
    document.getElementById("flipLabel").textContent = "Flip to " + (otherSide(side) === "white" ? "White" : "Black");

    const banner = document.getElementById("teamContextBanner");
    if(!state.myTeam){
      banner.innerHTML = `👆 Pick your team's colour to lock it in — the sheet then knows which side counts Miscommunications and which counts Interceptions.`;
    } else if(side === state.myTeam){
      banner.innerHTML = `🤝 <strong class="text-main">Your team's side</strong> · your clues · <strong class="text-main">?</strong> = your team's guess · 💾 = the real code`;
    } else {
      banner.innerHTML = `🕵️ <strong class="text-main">Opponent's side</strong> · their clues · <strong class="text-main">?</strong> = your interception guess · 💾 = their real code`;
    }
  }

  function renderPips(containerId, count, kind){
    const prev = lastTokens[kind];
    let html = "";
    const total = Math.max(count, 2);
    for(let i = 0; i < total; i++){
      html += i < count
        ? tokenHtml(kind, "token-lg", prev !== null && i >= prev ? "pop" : "")
        : `<span class="token-slot-empty"></span>`;
    }
    document.getElementById(containerId).innerHTML = html;
    lastTokens[kind] = count;
  }

  function renderTokenPanel(){
    let miscomm = 0, intercept = 0;
    if(state.myTeam){
      const mine = state.myTeam, other = otherSide(mine);
      for(let r = 0; r < ROUNDS; r++){
        const m = roundOutcome(mine, r);
        if(m.codeOk && m.guessOk && !m.match) miscomm++;
        const o = roundOutcome(other, r);
        if(o.match) intercept++;
      }
    }
    if(lastTokens.miscomm !== miscomm) renderPips("miscommPips", miscomm, "miscomm");
    if(lastTokens.intercept !== intercept) renderPips("interceptPips", intercept, "intercept");
    document.getElementById("miscommWarning").classList.toggle("hidden", miscomm < 2);
    document.getElementById("interceptWarning").classList.toggle("hidden", intercept < 2);
    document.getElementById("tokensPanel").classList.toggle("inactive", !state.myTeam);
    document.getElementById("tokensHint").textContent = state.myTeam ? "" : "Pick your team to start counting";
  }

  function render(){
    document.getElementById("teamName").value = state.teamName;
    renderRounds();
    renderCodesSection();
    renderSideChrome();
    renderTeamSwitch();
    renderTokenPanel();
  }

  function scrollToCurrent(){
    if(!mobileQuery.matches) return;
    const wrap = document.getElementById("roundsWrap");
    const panel = wrap.querySelector(".current-round") || wrap.firstElementChild;
    if(panel) wrap.scrollLeft = panel.offsetLeft - 12;
  }

  /* ---------- PAPER FLIP ---------- */

  function flipAnimate(apply){
    const paper = document.getElementById("paper");
    if(isFlipping) return;
    if(reduceMotion.matches || typeof paper.animate !== "function"){ apply(); return; }

    isFlipping = true;
    paper.classList.add("is-flipping");
    const shade = paper.querySelector(".paper-shade");
    const dir = state.activeSide === "white" ? 1 : -1;
    const P = "perspective(2200px)";

    const lift = paper.animate([
      { transform: `${P} rotateY(0deg) scale(1)` },
      { transform: `${P} rotateY(${-90 * dir}deg) scale(0.95)` }
    ], { duration: 260, easing: "cubic-bezier(.55,0,.8,.4)", fill: "forwards" });
    const shadeIn = shade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: "ease-in", fill: "forwards" });

    const finish = () => {
      paper.classList.remove("is-flipping");
      isFlipping = false;
    };

    lift.finished.then(() => {
      apply();
      const land = paper.animate([
        { transform: `${P} rotateY(${90 * dir}deg) scale(0.95)` },
        { transform: `${P} rotateY(${-6 * dir}deg) scale(1)`, offset: 0.8 },
        { transform: `${P} rotateY(0deg) scale(1)` }
      ], { duration: 380, easing: "cubic-bezier(.2,.7,.3,1)" });
      const shadeOut = shade.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: "ease-out" });
      lift.cancel();
      shadeIn.cancel();
      land.finished.then(finish, finish);
    }).catch(() => { apply(); finish(); });
  }

  function flipSide(){
    if(isFlipping) return;
    flipAnimate(() => {
      state.activeSide = otherSide(state.activeSide);
      persist();
      render();
      scrollToCurrent();
    });
  }

  /* ---------- FOCUS FLOW ---------- */
  /* Digits move down the "?" column first, then down the code column. */

  function focusStep(rIdx, field, li, dir){
    const idx = FOCUS_ORDER.findIndex(([f, l]) => f === field && l === li);
    for(let i = idx + dir; i >= 0 && i < FOCUS_ORDER.length; i += dir){
      const [f, l] = FOCUS_ORDER[i];
      const inp = document.querySelector(`[data-round="${rIdx}"][data-line="${l}"][data-field="${f}"]`);
      if(inp && !inp.disabled){ inp.focus(); inp.select(); return true; }
    }
    return false;
  }

  /* ---------- EVENTS ---------- */

  const roundsWrap = document.getElementById("roundsWrap");

  roundsWrap.addEventListener("input", function(e){
    const el = e.target;
    if(el.dataset.round === undefined) return;
    const rIdx = +el.dataset.round, li = +el.dataset.line, field = el.dataset.field;
    const line = currentSideData().rounds[rIdx].lines[li];

    if(field === "text"){
      line.text = el.value;
      persist();
      renderCodesSection();
      return;
    }

    el.value = el.value.replace(/[^1-4]/g, "").slice(0, 1);
    line[field] = el.value;
    persist();

    refreshRound(rIdx);
    refreshCurrentMarker();
    if(field === "b") renderCodesSection();
    renderTokenPanel();

    if(el.value) focusStep(rIdx, field, li, 1);
  });

  roundsWrap.addEventListener("change", function(e){
    if(e.target.dataset.round !== undefined) commit();
  });

  roundsWrap.addEventListener("focusin", function(e){
    if(e.target.classList.contains("sq-input")) e.target.select();
  });

  roundsWrap.addEventListener("keydown", function(e){
    const el = e.target;
    if(el.dataset.round === undefined) return;
    const rIdx = +el.dataset.round, li = +el.dataset.line, field = el.dataset.field;

    if(field !== "text" && e.key === "Backspace" && !el.value){
      e.preventDefault();
      focusStep(rIdx, field, li, -1);
    } else if(field === "text" && e.key === "Enter"){
      e.preventDefault();
      const next = li < 2
        ? document.querySelector(`[data-round="${rIdx}"][data-line="${li + 1}"][data-field="text"]`)
        : null;
      if(next) next.focus();
      else focusStep(rIdx, "a", -1, 1) || el.blur();
    }
  });

  document.getElementById("teamName").addEventListener("change", function(e){
    state.teamName = e.target.value;
    commit();
  });

  function nudge(id){
    const el = document.getElementById(id);
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
    setTimeout(() => el.classList.remove("shake"), 400);
  }

  document.getElementById("teamSwitch").addEventListener("click", function(e){
    const btn = e.target.closest("[data-team]");
    if(!btn || isFlipping) return;
    if(state.myTeam){
      if(btn.dataset.team !== state.myTeam){ nudge("teamSwitch"); nudge("lockBtn"); }
      return;
    }
    state.myTeam = btn.dataset.team;
    lastTokens = { miscomm: null, intercept: null };
    persist();
    render();

    const sw = document.getElementById("teamSwitch");
    sw.classList.add("just-locked");
    setTimeout(() => sw.classList.remove("just-locked"), 500);

    if(state.activeSide !== state.myTeam){
      setTimeout(() => flipAnimate(() => {
        state.activeSide = state.myTeam;
        persist();
        render();
        scrollToCurrent();
      }), 350);
    }
  });

  document.getElementById("lockBtn").addEventListener("click", function(){
    if(confirm("Unlock your team colour? Your clues and codes stay — only the team choice is cleared.")){
      state.myTeam = null;
      lastTokens = { miscomm: null, intercept: null };
      persist();
      render();
    }
  });

  document.getElementById("flipBtn").addEventListener("click", flipSide);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  document.getElementById("resetBtn").addEventListener("click", function(){
    if(confirm("Start a new game? This clears both sides, all tokens and the team lock.")){
      resetAll();
    }
  });

  window.addEventListener("keydown", function(e){
    const t = e.target;
    const typing = t && t.matches && t.matches("input, textarea");
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();

    if(mod && k === "z" && !e.shiftKey){
      e.preventDefault();
      if(typing) t.blur(); // commits the edit in progress so it can be undone
      undo();
    } else if(mod && ((k === "z" && e.shiftKey) || k === "y")){
      e.preventDefault();
      if(typing) t.blur();
      redo();
    } else if(!mod && !e.altKey && !typing && k === "f"){
      e.preventDefault();
      flipSide();
    }
  });

  render();
  updateToolbar();
  requestAnimationFrame(scrollToCurrent);
})();
</script>
</body>
</html>
