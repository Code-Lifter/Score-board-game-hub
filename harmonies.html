<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harmonies Smart Scorepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Nunito:wght@400;700;800&display=swap');
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: #E7D9B9; 
            overscroll-behavior-y: none;
        }

        .font-display { font-family: 'Fraunces', serif; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .score-input {
            font-family: 'Fraunces', serif;
            font-weight: bold;
            color: #3A2B1F;
            background: transparent;
            font-size: 1.15rem; 
        }
        
        .score-input:focus {
            background-color: #fff;
            outline: none;
            box-shadow: inset 0 0 0 2px #C1543F;
        }

        @keyframes pulse-accent {
            0%, 100% { color: #C1543F; text-shadow: 0 0 5px rgba(193, 84, 63, 0.4); }
            50% { color: #e06851; text-shadow: 0 0 15px rgba(193, 84, 63, 0.8); }
        }
        .winner-text { animation: pulse-accent 2s infinite; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-[#3A2B1F] h-screen flex flex-col overflow-hidden">

    <div class="max-w-lg mx-auto bg-[#F3E9CE] w-full h-full shadow-2xl flex flex-col relative border-x border-black/10">
        
        <!-- Header -->
        <div class="bg-[#3A2B1F] text-[#E7D9B9] py-3 text-center border-b-4 border-[#C1543F] shadow-md z-30 flex-none relative">
            <h1 class="font-display text-2xl tracking-[0.15em] font-bold relative inline-block">
                HARMONIES
                <i class="fas fa-tree absolute -left-7 top-1 text-[#6F8F4E] opacity-90 text-lg"></i>
                <i class="fas fa-paw absolute -right-7 top-1 text-[#DFAE33] opacity-90 text-lg"></i>
            </h1>
            <p class="text-[#D8C69C] text-[10px] uppercase tracking-widest mt-0 font-bold">Smart Scorepad</p>
        </div>

        <!-- Controls -->
        <div class="bg-[#D8C69C] p-3 border-b border-black/10 flex justify-between items-center z-20 shadow-sm flex-none">
            <div class="flex items-center gap-3">
                <div class="flex items-center bg-white/60 rounded-lg border border-black/20 px-2 py-1 shadow-inner">
                    <i class="fas fa-users text-[#6b5a48] text-xs mr-2"></i>
                    <select id="playerCount" class="bg-transparent text-[#3A2B1F] font-bold focus:outline-none text-sm cursor-pointer" onchange="changePlayerCount()">
                        <option value="2">2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4" selected>4 Players</option>
                    </select>
                </div>
            </div>
            <button onclick="resetGame()" class="text-xs font-bold text-white uppercase tracking-wider bg-[#BC4C3B] px-3 py-1.5 rounded-lg hover:brightness-110 transition-all shadow border border-black/20">
                <i class="fas fa-rotate-right mr-1"></i> Reset
            </button>
        </div>

        <!-- Scrollable Table Area (Single Table Architecture) -->
        <div class="flex-grow overflow-y-auto no-scrollbar relative">
            <table class="w-full border-collapse table-fixed h-full" id="scoreTable">
                <thead class="sticky top-0 z-20 shadow-[0_2px_4px_rgba(0,0,0,0.05)] bg-[#D8C69C]" id="tableHead">
                    <!-- Head injected by JS -->
                </thead>
                <tbody id="tableBody" class="bg-[#F3E9CE]">
                    <!-- Body injected by JS -->
                </tbody>
                <tfoot id="tableFooter" class="sticky bottom-0 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.15)] bg-[#3A2B1F] text-white">
                    <!-- Footer injected by JS -->
                </tfoot>
            </table>
        </div>
    </div>

<script>
    // 1. State now tracks how many animal rows exist (defaults to 4)
    let state = {
        playerCount: 4,
        animalCount: 4,
        scores: {},
        playerNames: ["", "", "", ""]
    };

    // 2. Dynamically generate the rows so we can inject infinite animals
    function getRowConfig() {
        let config = [
            { type: 'header', label: 'Landscape' },
            { id: 'trees', label: 'Trees', color: '#6F8F4E' },
            { id: 'mountains', label: 'Mountains', color: '#8B93A0' },
            { id: 'fields', label: 'Fields', color: '#DFAE33' },
            { id: 'buildings', label: 'Buildings', color: '#BC4C3B' },
            { id: 'water', label: 'Water', color: '#3D8AA1' },
            { type: 'subtotal', id: 'landscapeTotal', label: 'Landscape Total' },
            { type: 'header', label: 'Animals', addBtn: true } // Flag to add the button
        ];
        
        for(let i = 1; i <= state.animalCount; i++) {
            config.push({ id: `animal${i}`, label: `Animal ${i}`, color: '#7a6a54' });
        }
        
        config.push(
            { id: 'nature', label: 'Nature Spirit', color: '#4a4038' },
            { type: 'subtotal', id: 'animalTotal', label: 'Animal Total' },
            { type: 'header', label: 'Tiebreaker' },
            { id: 'cubes', label: 'Animal Cubes', color: '#3A2B1F' }
        );
        return config;
    }

    function init() {
        loadState();
        renderUI();
    }

    function saveState() {
        localStorage.setItem('harmonies_app_state', JSON.stringify(state));
    }

    function loadState() {
        const saved = localStorage.getItem('harmonies_app_state');
        if (saved) {
            try {
                state = { ...state, ...JSON.parse(saved) };
                state.animalCount = state.animalCount || 4; // Ensure old saves don't break
                while(state.playerNames.length < 4) state.playerNames.push("");
            } catch (e) { console.error(e); }
        }
        document.getElementById('playerCount').value = state.playerCount;
    }

    function changePlayerCount() {
        state.playerCount = parseInt(document.getElementById('playerCount').value);
        saveState();
        renderUI();
    }

    function updateName(idx, val) {
        state.playerNames[idx] = val;
        saveState();
    }

    function updateScore(rowId, playerIdx, val) {
        const key = `${rowId}-${playerIdx}`;
        if (val === "" || val === null) delete state.scores[key];
        else state.scores[key] = parseInt(val);
        
        saveState();
        renderSubtotals();
        renderFooter(); 
    }

    // 3. Function to add an animal row
    function addAnimalRow() {
        state.animalCount++;
        saveState();
        renderUI();
    }

    function renderUI() {
        renderHeader();
        renderBody();
        renderSubtotals();
        renderFooter();
    }

    function renderHeader() {
        let html = `
            <tr class="h-10 border-b border-black/20">
                <th class="p-2 text-left w-[28%] border-r border-black/10 bg-[#e8debe]">
                    <span class="font-display italic text-[#6b5a48] text-xs pl-1">Category</span>
                </th>`;
        
        for (let i = 0; i < state.playerCount; i++) {
            html += `
                <th class="p-1 border-l border-black/10 bg-[#E7D9B9] relative group focus-within:bg-white transition-colors">
                    <input type="text" value="${state.playerNames[i]}" oninput="updateName(${i}, this.value)"
                        class="w-full bg-transparent text-center font-display font-bold text-[#3A2B1F] placeholder-black/30 focus:outline-none text-xs md:text-sm truncate px-1"
                        placeholder="Player ${i+1}">
                </th>`;
        }
        html += `</tr>`;
        document.getElementById('tableHead').innerHTML = html;
    }

    function renderBody() {
        const rows = getRowConfig();
        let html = '';
        
        rows.forEach(row => {
            if (row.type === 'header') {
                // The highly visible Add Animal button
                const btnHtml = row.addBtn ? 
                    `<button onclick="addAnimalRow()" class="bg-[#6F8F4E] text-white px-3 py-1 rounded shadow-md border border-black/20 hover:brightness-110 active:scale-95 transition-all text-[10px] tracking-widest font-extrabold flex items-center gap-1.5 cursor-pointer">
                        <i class="fas fa-plus"></i> ADD ANIMAL
                    </button>` : '';
                    
                html += `<tr>
                    <td colspan="${state.playerCount + 1}" class="bg-[#D8C69C]/50 px-2 py-1.5 border-y border-black/10 shadow-inner align-middle">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] uppercase tracking-widest font-extrabold text-[#6b5a48]">${row.label}</span>
                            ${btnHtml}
                        </div>
                    </td>
                </tr>`;
            } else if (row.type === 'subtotal') {
                html += `<tr class="bg-black/5 h-8 border-b border-black/10">
                    <td class="p-2 text-right border-r border-black/10"><span class="text-[9px] uppercase tracking-widest font-extrabold text-[#6b5a48]">${row.label}</span></td>`;
                for (let p = 0; p < state.playerCount; p++) {
                    html += `<td class="text-center font-display font-bold text-sm text-[#3A2B1F]/60" id="${row.id}-${p}">0</td>`;
                }
                html += `</tr>`;
            } else {
                html += `<tr class="bg-white/40 border-b border-black/5 h-12">
                    <td class="p-1 text-left border-r border-black/10 relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1.5" style="background-color: ${row.color}"></div>
                        <span class="font-display text-[#3A2B1F] text-[0.75rem] font-bold leading-tight pl-3">${row.label}</span>
                    </td>`;
                for (let p = 0; p < state.playerCount; p++) {
                    const val = state.scores[`${row.id}-${p}`] ?? '';
                    html += `<td class="p-0 border-l border-black/10 text-center align-middle bg-white/20">
                        <input type="number" pattern="[0-9]*" inputmode="numeric" min="0" value="${val}" placeholder="-"
                            onchange="updateScore('${row.id}', ${p}, this.value)" onfocus="this.select()"
                            class="score-input w-full h-full text-center rounded-none p-0">
                    </td>`;
                }
                html += `</tr>`;
            }
        });
        document.getElementById('tableBody').innerHTML = html;
    }

    function renderSubtotals() {
        const lands = ['trees','mountains','fields','buildings','water'];

        for (let p = 0; p < state.playerCount; p++) {
            let lSum = 0; let aSum = 0;
            
            // Tally landscapes
            lands.forEach(id => lSum += (state.scores[`${id}-${p}`] || 0));
            
            // Tally dynamic animal rows + nature spirit
            for (let i = 1; i <= state.animalCount; i++) {
                aSum += (state.scores[`animal${i}-${p}`] || 0);
            }
            aSum += (state.scores[`nature-${p}`] || 0);
            
            document.getElementById(`landscapeTotal-${p}`).innerText = lSum;
            document.getElementById(`animalTotal-${p}`).innerText = aSum;
        }
    }

    function renderFooter() {
        const rows = getRowConfig();
        const scoreIds = rows.filter(r => !r.type && r.id !== 'cubes').map(r => r.id);
        let totals = []; let maxScore = -1;

        for (let p = 0; p < state.playerCount; p++) {
            let sum = 0;
            scoreIds.forEach(id => sum += (state.scores[`${id}-${p}`] || 0));
            totals.push(sum);
            if (sum > maxScore && sum > 0) maxScore = sum;
        }

        let html = `<tr class="h-16">
            <td class="bg-[#2A1F16] p-2 text-right border-r border-black/40">
                <span class="text-[0.65rem] uppercase tracking-widest font-bold text-[#D8C69C] block">Grand</span>
                <span class="text-[0.55rem] text-white/50">TOTAL</span>
            </td>`;

        for (let p = 0; p < state.playerCount; p++) {
            const score = totals[p];
            const isWinner = score === maxScore && score > 0;
            const winnerClass = isWinner ? 'winner-text font-bold text-3xl' : 'text-[#E7D9B9]/70 text-xl';
            const crown = isWinner ? '<div class="absolute top-1 left-1/2 transform -translate-x-1/2 text-[#DFAE33] text-[10px]"><i class="fas fa-crown"></i></div>' : '';

            html += `<td class="p-1 text-center border-l border-black/40 font-display relative bg-[#3A2B1F]">
                ${crown}
                <span class="${winnerClass} transition-all duration-300 mt-2 block">${score}</span>
            </td>`;
        }
        html += `</tr>`;
        document.getElementById('tableFooter').innerHTML = html;
    }

    function resetGame() {
        if(confirm("Clear all scores? (Names will be kept)")) {
            state.scores = {};
            state.animalCount = 4; // Resets back to 4 animals on a new game
            saveState();
            renderUI();
        }
    }

    init();
</script>
</body>
</html>
