<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jekyll vs. Hyde Referee</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #e0e0e0;
      --jekyll: #4a90e2;
      --hyde: #d0021b;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; padding: 15px;
      display: flex; flex-direction: column; gap: 15px;
    }
    .panel {
      background: var(--panel); padding: 15px;
      border-radius: 8px; border: 1px solid #333;
    }
    h2, h3 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 5px; }
    
    /* Tracker */
    .track {
      display: flex; justify-content: space-between;
      position: relative; margin: 30px 0 10px 0;
    }
    .track::before {
      content: ''; position: absolute; top: 50%; left: 0; right: 0;
      height: 4px; background: #444; z-index: 1; transform: translateY(-50%);
    }
    .space {
      width: 20px; height: 20px; border-radius: 50%;
      background: #333; z-index: 2; border: 2px solid #111;
    }
    #marker {
      width: 30px; height: 30px; background: var(--hyde);
      border-radius: 50%; position: absolute; top: 50%; left: 0%;
      transform: translate(-15px, -50%); z-index: 3;
      transition: left 0.4s ease; border: 2px solid white;
    }

    /* Controls */
    select, button, input {
      width: 100%; padding: 12px; margin-bottom: 10px;
      background: #333; color: white; border: 1px solid #555;
      border-radius: 4px; font-size: 16px;
    }
    button { cursor: pointer; font-weight: bold; }
    button.action { background: var(--jekyll); }
    button.danger { background: #800; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    /* Suit Ladder */
    .ladder { display: flex; justify-content: space-between; font-size: 24px; margin-bottom: 15px;}
    .slot { width: 30%; background: #222; text-align: center; padding: 10px; border-radius: 4px;}
    
    #log { font-size: 14px; color: #aaa; max-height: 100px; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="panel">
    <h2 id="round-display">Round 1</h2>
    <p id="exchange-rules" style="color: #ffcc00; font-weight: bold;"></p>
    <button onclick="nextRound()">Start Next Round</button>
  </div>

  <div class="panel">
    <h3>Suit Power Ladder</h3>
    <div class="ladder">
      <div class="slot" id="rank-1">-</div>
      <div class="slot" id="rank-2">-</div>
      <div class="slot" id="rank-3">-</div>
    </div>
    <div class="grid-2">
      <button onclick="addSuit('♥️')">Add ♥️ (Red)</button>
      <button onclick="addSuit('♠️')">Add ♠️ (Green)</button>
      <button onclick="addSuit('♦️')">Add ♦️ (Blue)</button>
      <button onclick="resetLadder()" class="danger">Reset (Green Potion)</button>
    </div>
  </div>

  <div class="panel">
    <h3>Identity Track</h3>
    <div class="track">
      <div class="space"></div><div class="space"></div><div class="space"></div>
      <div class="space"></div><div class="space"></div><div class="space"></div>
      <div class="space"></div><div class="space"></div><div class="space"></div>
      <div class="space"></div><div class="space"></div>
      <div id="marker"></div>
    </div>
    <div class="grid-2">
      <input type="number" id="jekyll-tricks" placeholder="Jekyll Tricks" min="0" max="10">
      <input type="number" id="hyde-tricks" placeholder="Hyde Tricks" min="0" max="10">
    </div>
    <button onclick="calculateEvil()" class="action">Move Marker</button>
  </div>

  <div class="panel">
    <h3>Game Log</h3>
    <div id="log">Game started...</div>
  </div>

  <script>
    // --- State Management ---
    let currentRound = 1;
    let markerPosition = 0; // 0 (Jekyll) to 10 (Hyde)
    let suitLadder = [];

    // Initialize Game
    updateExchangeRules();

    // --- Phase 1: Preparation ---
    function nextRound() {
      if (currentRound >= 3) {
        alert("Game Over! Check the final marker position.");
        return;
      }
      currentRound++;
      document.getElementById('round-display').innerText = `Round ${currentRound}`;
      resetLadder();
      updateExchangeRules();
      logEvent(`--- Round ${currentRound} Started ---`);
    }

    function updateExchangeRules() {
      const rules = {
        1: "Exchange 1 card simultaneously.",
        2: "Exchange 2 cards simultaneously.",
        3: "Exchange 3 cards simultaneously."
      };
      const potionWarning = "<br>⚠️ If you have 2+ ♣️ (Potions), you MUST include at least 1 in the exchange.";
      document.getElementById('exchange-rules').innerHTML = rules[currentRound] + potionWarning;
    }

    // --- Phase 2: Suit Power ---
    function addSuit(suit) {
      if (suitLadder.length < 3 && !suitLadder.includes(suit)) {
        suitLadder.push(suit);
        renderLadder();
        logEvent(`${suit} added to ladder at Rank ${suitLadder.length}`);
      }
    }

    function resetLadder() {
      suitLadder = [];
      renderLadder();
      logEvent("Suit ladder reset by Green Potion!");
    }

    function renderLadder() {
      document.getElementById('rank-1').innerText = suitLadder[0] || '-';
      document.getElementById('rank-2').innerText = suitLadder[1] || '-';
      document.getElementById('rank-3').innerText = suitLadder[2] || '-';
    }

    // --- Phase 3: Progression of Evil ---
    function calculateEvil() {
      const jTricks = parseInt(document.getElementById('jekyll-tricks').value) || 0;
      const hTricks = parseInt(document.getElementById('hyde-tricks').value) || 0;
      
      if (jTricks + hTricks > 10) {
        alert("Error: Total tricks cannot exceed 10.");
        return;
      }

      const difference = Math.abs(jTricks - hTricks);
      markerPosition += difference;
      
      if (markerPosition > 10) markerPosition = 10;
      
      document.getElementById('marker').style.left = (markerPosition * 10) + '%';
      logEvent(`Round ended. Difference: ${difference}. Hyde is at step ${markerPosition}.`);

      if (markerPosition === 10) {
        alert("HYDE WINS! The darkness has taken over.");
      }

      // Clear inputs
      document.getElementById('jekyll-tricks').value = '';
      document.getElementById('hyde-tricks').value = '';
    }

    function logEvent(message) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML = `<div>> ${message}</div>` + logDiv.innerHTML;
    }
  </script>
</body>
</html>
