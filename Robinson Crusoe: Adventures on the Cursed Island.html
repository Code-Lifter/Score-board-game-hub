<!DOCTYPE html>
<html lang="en">

    <style>
        /* Smooth transitions for mobile tapping */

</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased min-h-screen flex flex-col">

    <main class="flex-grow w-full max-w-md mx-auto p-4 flex flex-col">

        </div>

        <div id="gameScreen" class="flex flex-col flex-grow hidden">
            
            <!-- Prominent Visual Day Track Header -->

                        </button>
                        <button id="redoBtn" class="p-2 bg-stone-800 hover:bg-stone-700 text-amber-400 rounded-lg border border-stone-700 disabled:opacity-30 disabled:cursor-not-allowed">

                    <div class="flex items-center space-x-3 bg-stone-950 px-4 py-2 rounded-xl border border-amber-500/40 shadow-inner">
                        <div class="flex flex-col items-end">
                            <span class="text-[10px] uppercase font-black tracking-widest text-amber-500">SURVIVAL TRACK</span>
                            <span class="text-xs text-stone-400 font-medium">MAX <span id="maxDayDisplay">12</span> DAYS</span>

        </div>

    <script>
        // Web Audio API Synthesizer for Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPhaseSound(type = 'next') {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'next') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(540, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'prev') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'dayChange') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(440, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        }

        // Core Render Loop
        function render() {
            if (!state.isActive) {
                setupScreen.classList.remove('hidden');
                gameScreen.classList.add('hidden');
                resetBtn.classList.add('hidden');
            } else {
                setupScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                resetBtn.classList.remove('hidden');

                // Update Header
                currentDayDisplay.innerText = state.currentDay;
                maxDayDisplay.innerText = state.dayLimit;

                // Render Day Dot Progress Bar
                dayProgressDots.innerHTML = '';
                for (let i = 1; i <= state.dayLimit; i++) {
                    const dot = document.createElement('div');
                    if (i < state.currentDay) {
                        dot.className = 'w-2 h-2 rounded-full bg-amber-600 opacity-60 flex-shrink-0';
                    } else if (i === state.currentDay) {
                        dot.className = 'w-3 h-3 rounded-full bg-amber-400 ring-2 ring-amber-500/50 flex-shrink-0';
                    } else {
                        dot.className = 'w-2 h-2 rounded-full bg-stone-700 flex-shrink-0';
                    }
                    dayProgressDots.appendChild(dot);
                }

                // Update Phase UI
                const currentPhase = phaseData[state.phaseIndex];
                phaseColorStrip.className = `h-3 w-full ${currentPhase.color}`;
                phaseIconContainer.innerHTML = currentPhase.icon;
                phaseNumber.innerText = state.phaseIndex + 1;
                phaseTitle.innerText = currentPhase.title;
                phaseDescription.innerHTML = currentPhase.desc;

                // Button States
                undoBtn.disabled = historyStack.length === 0;
                redoBtn.disabled = redoStack.length === 0;

                // Handle End Game limits
                if (state.currentDay >= state.dayLimit && state.phaseIndex === phaseData.length - 1) {
                    nextBtn.innerHTML = "Game Over 💀";
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    nextBtn.innerHTML = "Next &rarr;";
                    nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }
            saveToStorage();
        }

        // Logic Mechanics
        function pushStateToHistory() {
            historyStack.push(JSON.parse(JSON.stringify(state)));
            redoStack = []; 
        }

        function goNext() {
            if (state.currentDay >= state.dayLimit && state.phaseIndex === phaseData.length - 1) return;
            pushStateToHistory();
            
            if (state.phaseIndex < phaseData.length - 1) {
                state.phaseIndex++;
                playPhaseSound('next');
            } else {
                state.phaseIndex = 0;
                state.currentDay++;
                playPhaseSound('dayChange');
            }
            render();
        }

        function goPrev() {
            if (state.currentDay === 1 && state.phaseIndex === 0) return;
            pushStateToHistory();
            
            if (state.phaseIndex > 0) {
                state.phaseIndex--;
                playPhaseSound('prev');
            } else {
                state.phaseIndex = phaseData.length - 1;
                state.currentDay--;
                playPhaseSound('dayChange');
            }
            render();
        }

        function undo() {
            if (historyStack.length === 0) return;
            redoStack.push(JSON.parse(JSON.stringify(state)));
            state = historyStack.pop();
            playPhaseSound('prev');
            render();
        }

        function redo() {
            if (redoStack.length === 0) return;
            historyStack.push(JSON.parse(JSON.stringify(state)));
            state = redoStack.pop();
            playPhaseSound('next');
            render();
        }

        // Local Storage Handlers
        function saveToStorage() {
            try {
                localStorage.setItem('robinsonCrusoeState', JSON.stringify({
                    state, historyStack, redoStack
                }));
            } catch (e) { console.warn("Local storage blocked or unavailable."); }
        }

        function loadFromStorage() {
            try {
                const saved = localStorage.getItem('robinsonCrusoeState');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = parsed.state;
                    historyStack = parsed.historyStack || [];
                    redoStack = parsed.redoStack || [];
                }
            } catch (e) { console.warn("Failed to read local storage."); }
        }

        function resetGame() {
            if (confirm("Abandon current expedition and reset?")) {
                state = { isActive: false, dayLimit: 12, currentDay: 1, phaseIndex: 0 };
                historyStack = [];
                redoStack = [];
                localStorage.removeItem('robinsonCrusoeState');
                render();
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', () => {
            const limit = parseInt(dayLimitInput.value) || 12;
            state = { isActive: true, dayLimit: limit, currentDay: 1, phaseIndex: 0 };
            historyStack = [];
            redoStack = [];
            playPhaseSound('dayChange');
            render();
        });

        nextBtn.addEventListener('click', goNext);
        prevBtn.addEventListener('click', goPrev);
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);
        resetBtn.addEventListener('click', resetGame);

        // Start the engine
        init();
    </script>
</body>
</html>
